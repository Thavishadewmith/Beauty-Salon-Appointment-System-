<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto mt-10">
        <h2 class="text-2xl font-bold text-center">Admin Dashboard</h2>
        <table class="table-auto w-full mt-4 bg-white shadow-lg rounded-lg">
            <thead>
                <tr class="bg-pink-500 text-white">
                    <th class="px-4 py-2">Customer</th>
                    <th class="px-4 py-2">Service</th>
                    <th class="px-4 py-2">Date</th>
                    <th class="px-4 py-2">Time</th>
                </tr>
            </thead>
            <tbody>
                <tr class="border-t">
                    <td class="px-4 py-2">Jane Doe</td>
                    <td class="px-4 py-2">Hair Styling</td>
                    <td class="px-4 py-2">2025-04-05</td>
                    <td class="px-4 py-2">3:00 PM</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>

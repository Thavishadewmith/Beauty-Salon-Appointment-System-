<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<nav class="bg-pink-500 p-4 text-white">
    <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold">Beauty Salon</h1>
        <div>
            <a href="index.html" class="px-4">Home</a>
            <a href="services.html" class="px-4">Our Services</a>
            <a href="booking.html" class="px-4">Book Appointment</a>
            <a href="reviews.html" class="px-4">Customer Reviews</a>
            <a href="profile.html" class="px-4">Profile</a>
        </div>
    </div>
</nav>
<body class="bg-gray-100">
    <div class="container mx-auto mt-10">
        <h2 class="text-3xl font-bold text-center">Customer Reviews</h2>
        
        
        <!-- Reviews Section -->
        <div class="mt-6">
            <div class="bg-white p-4 shadow-lg rounded-lg mb-4">
                <p class="font-bold">Jane Doe</p>
                <p class="text-gray-600">"Amazing service! My hair has never looked better."</p>
                <span class="text-yellow-500">⭐⭐⭐⭐⭐</span>
            </div>
            <div class="bg-white p-4 shadow-lg rounded-lg mb-4">
                <p class="font-bold">John Smith</p>
                <p class="text-gray-600">"Friendly staff and great ambiance. Highly recommended!"</p>
                <span class="text-yellow-500">⭐⭐⭐⭐⭐</span>
            </div>
        </div>

        <!-- Add Review Form -->
        <div class="bg-white p-6 shadow-lg rounded-lg mt-10">
            <h3 class="text-xl font-bold">Leave a Review</h3>
            <form class="mt-4">
                <div class="mb-3">
                    <label class="block text-gray-700 font-bold">Your Name</label>
                    <input type="text" class="w-full p-2 border rounded-md" placeholder="Enter your name">
                </div>
                <div class="mb-3">
                    <label class="block text-gray-700 font-bold">Your Review</label>
                    <textarea class="w-full p-2 border rounded-md" placeholder="Write your review"></textarea>
                </div>
                <div class="mb-3">
                    <label class="block text-gray-700 font-bold">Rating</label>
                    <select class="w-full p-2 border rounded-md">
                        <option>⭐ - Poor</option>
                        <option>⭐⭐ - Fair</option>
                        <option>⭐⭐⭐ - Good</option>
                        <option>⭐⭐⭐⭐ - Very Good</option>
                        <option>⭐⭐⭐⭐⭐ - Excellent</option>
                    </select>
                </div>
                <button class="bg-pink-500 text-white px-4 py-2 rounded-lg">Submit Review</button>
            </form>
        </div>
    </div>
</body>
</html>

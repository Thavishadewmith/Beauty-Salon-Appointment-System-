<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- Navbar -->
    <nav class="bg-pink-500 p-4 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold"><a href="index.html" class="px-4">Beauty Salon</a></h1>
            <div>
                <a href="index.html" class="px-4">Home</a>
                <a href="services.html" class="px-4">Our Services</a>
                <a href="booking.html" class="px-4">Book Appointment</a>
                <a href="reviews.html" class="px-4">Customer Reviews</a>
                <a href="profile.html" class="px-4">Profile</a>
            </div>
        </div>
    </nav>

    <!-- Sign Up Form -->
    <div class="flex items-center justify-center h-screen">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h2 class="text-2xl font-bold text-center">Sign Up</h2>
            <form id="signupForm" class="mt-4">
                <div class="mb-3">
                    <label class="block text-gray-700 font-bold">Full Name</label>
                    <input type="text" id="fullName" class="w-full p-2 border rounded-md" placeholder="Enter your full name" required>
                </div>
                <div class="mb-3">
                    <label class="block text-gray-700 font-bold">Email</label>
                    <input type="email" id="signupEmail" class="w-full p-2 border rounded-md" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label class="block text-gray-700 font-bold">Password</label>
                    <input type="password" id="signupPassword" class="w-full p-2 border rounded-md" placeholder="Create a password" required>
                </div>
                <button type="submit" class="bg-pink-500 text-white px-4 py-2 w-full rounded-lg">Sign Up</button>
            </form>
            <p class="text-gray-600 text-center mt-4">
                Already have an account? <a href="login.html" class="text-pink-500">Login</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();
            let fullName = document.getElementById("fullName").value;
            let email = document.getElementById("signupEmail").value;
            let password = document.getElementById("signupPassword").value;

            localStorage.setItem("userEmail", email);
            localStorage.setItem("userPassword", password);

            alert("Account created successfully!");
            window.location.href = "login.html"; 
        });
    </script>
</body>
</html>

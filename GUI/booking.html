<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-gray-100">
    <nav class="bg-pink-500 p-4 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Beauty Salon</h1>
            <div>
                <a href="index.html" class="px-4">Home</a>
                <a href="services.html" class="px-4">Our Services</a>
                <a href="booking.html" class="px-4">Book Appointment</a>
                <a href="reviews.html" class="px-4">Customer Reviews</a>
                <a href="profile.html" class="px-4">Profile</a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto mt-10 bg-white p-6 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold text-center">Book Your Appointment</h2>
        <form class="mt-4">
            <div class="mb-3">
                <label class="block text-gray-700 font-bold">Full Name</label>
                <input type="text" class="form-control" placeholder="Enter your name">
            </div>
            <div class="mb-3">
                <label class="block text-gray-700 font-bold">Select Service</label>
                <select class="form-control">
                    <option>Hair Styling</option>
                    <option>Manicure & Pedicure</option>
                    <option>Facial</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="block text-gray-700 font-bold">Select Date</label>
                <input type="date" class="form-control">
            </div>
            <div class="mb-3">
                <label class="block text-gray-700 font-bold">Select Time</label>
                <input type="time" class="form-control">
            </div>
            <button class="bg-pink-500 text-white px-4 py-2 rounded-lg">Submit</button>
        </form>
    </div>
</body>
</html>

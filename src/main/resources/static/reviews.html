<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image.png" href="favicon.png">

    <title>Reviews - Beauty Salon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background-color: rgba(0, 0, 0);
            backdrop-filter: blur(5px);
        }
        .main-content {
            padding-top: 80px;
        }
        .review-card {
            transition: all 0.3s ease;
        }
        .review-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(195, 20, 20, 0.2);
        }
        .popup {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 1rem 2rem;
            background-color: #4CAF50;
            color: white;
            border-radius: 4px;
            box-shadow: 0 2px 4px rgb(0, 0, 0);
            z-index: 1000;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .error {
            background-color: #f44336;
        }
        .star-rating {
            color: #ffd700;
            font-size: 1.5rem;
        }
        .star-rating .star {
            cursor: pointer;
            transition: color 0.2s;
        }
        .star-rating .star:hover,
        .star-rating .star.active {
            color: #ffd700;
        }
        .blurred-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url('/salon-bg.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(1px);
            opacity: 1;
        }
        .content-overlay {
            position: relative;
            z-index: 1;
            background-color: rgba(255, 255, 255, 0.9);
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="blurred-background"></div>
    <div class="content-overlay">
        <!-- Navbar -->
        <nav class="navbar p-4">
            <div class="container mx-auto flex justify-between items-center">
                <a href="index.html" class="text-white text-xl font-semibold">Beauty Salon</a>
                <div class="space-x-4">
                    <a href="index.html" class="text-white px-4 py-2 hover:bg-gray-700 rounded-lg">Home</a>
                    <a href="service.html" class="text-white px-4 py-2 hover:bg-gray-700 rounded-lg">Services</a>
                    <a href="reviews.html" class="text-white px-4 py-2 hover:bg-gray-700 rounded-lg">Reviews</a>
                    <a href="book.html" class="text-white px-4 py-2 border-2 border-white hover:bg-white hover:text-black rounded-lg transition duration-300">BOOK NOW</a>
                    <a href="login.html" id="loginLink" class="text-white px-4 py-2 border-2 border-white hover:bg-white hover:text-black rounded-lg transition duration-300">Login</a>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container mx-auto p-8">
                <!-- Reviews List -->
                <div class="bg-white rounded-lg shadow-lg p-8 mb-8">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Customer Reviews</h2>
                    <div id="reviewsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Reviews will be loaded here -->
                    </div>
                </div>

                <!-- Review Form (shown only for logged-in users) -->
                <div id="reviewFormContainer" class="hidden bg-white rounded-lg shadow-lg p-6 max-w-2xl mx-auto">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Write a Review</h2>
                    <form id="reviewForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Rating</label>
                            <div class="star-rating mt-1 flex space-x-1" id="ratingStars">
                                <i class="fas fa-star star cursor-pointer text-gray-300 hover:text-yellow-400" data-rating="1"></i>
                                <i class="fas fa-star star cursor-pointer text-gray-300 hover:text-yellow-400" data-rating="2"></i>
                                <i class="fas fa-star star cursor-pointer text-gray-300 hover:text-yellow-400" data-rating="3"></i>
                                <i class="fas fa-star star cursor-pointer text-gray-300 hover:text-yellow-400" data-rating="4"></i>
                                <i class="fas fa-star star cursor-pointer text-gray-300 hover:text-yellow-400" data-rating="5"></i>
                            </div>
                            <input type="hidden" id="rating" name="rating" required>
                        </div>
                        <div>
                            <label for="comment" class="block text-sm font-medium text-gray-700">Your Review</label>
                            <textarea id="comment" name="comment" rows="3" required
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm"
                                placeholder="Share your experience with us..."></textarea>
                        </div>
                        <button type="submit"
                            class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition duration-300 text-sm">
                            Submit Review
                        </button>
                    </form>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white shadow-lg mt-12">
            <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
                <p class="text-center text-gray-500 text-sm">
                    © 2024 Beauty Salon. All rights reserved.
                </p>
            </div>
        </footer>

        <!-- Popup for messages -->
        <div id="popup" class="popup"></div>
    </div>

    <script>
        // Global function for loading reviews
        async function loadReviews() {
            try {
                console.log('Loading reviews...');
                const response = await fetch('/api/reviews');
                console.log('Reviews response status:', response.status);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch reviews');
                }
                
                const data = await response.json();
                console.log('Reviews data:', data);
                
                if (data.status === 'error') {
                    throw new Error(data.message);
                }
                
                const reviews = data.reviews;
                const reviewsList = document.getElementById('reviewsList');
                
                if (!reviews || reviews.length === 0) {
                    reviewsList.innerHTML = `
                        <div class="text-center py-8">
                            <p class="text-gray-600 text-lg">No reviews yet. Be the first to review!</p>
                        </div>
                    `;
                    return;
                }
                
                reviewsList.innerHTML = reviews.map(review => `
                    <div class="review-card bg-white border border-gray-200 rounded-lg p-6 h-full">
                        <div class="flex flex-col h-full">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center">
                                    <div class="star-rating">
                                        ${Array(5).fill().map((_, i) => `
                                            <i class="fas fa-star ${i < review.rating ? 'text-yellow-400' : 'text-gray-300'}"></i>
                                        `).join('')}
                                    </div>
                                    <span class="ml-2 text-gray-600 text-sm">by ${review.username}</span>
                                </div>
                                ${review.username === localStorage.getItem('username') ? `
                                    <button onclick="deleteReview('${review.username}', '${review.date}')" 
                                        class="text-red-600 hover:text-red-800 transition duration-300">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                ` : ''}
                            </div>
                            <p class="text-gray-800 text-sm flex-grow">${review.comment}</p>
                            <p class="text-xs text-gray-500 mt-3">
                                ${new Date(review.date).toLocaleDateString('en-US', {
                                    year: 'numeric',
                                    month: 'long',
                                    day: 'numeric'
                                })}
                            </p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading reviews:', error);
                const reviewsList = document.getElementById('reviewsList');
                reviewsList.innerHTML = `
                    <div class="text-center py-8">
                        <p class="text-red-600 text-lg">Failed to load reviews. Please try again later.</p>
                        <button onclick="loadReviews()" class="mt-4 inline-block bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition duration-300">
                            Retry
                        </button>
                    </div>
                `;
            }
        }

        // Global function for deleting reviews
        async function deleteReview(username, date) {
            if (!confirm('Are you sure you want to delete this review?')) {
                return;
            }

            console.log('Attempting to delete review:', { username, date });

            try {
                // Encode the date properly for the URL
                const encodedDate = encodeURIComponent(date);
                const encodedUsername = encodeURIComponent(username);
                
                console.log('Encoded values:', { encodedUsername, encodedDate });
                
                const response = await fetch(`/api/reviews/${encodedUsername}/${encodedDate}`, {
                    method: 'DELETE',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                console.log('Delete response status:', response.status);
                const responseText = await response.text();
                console.log('Delete response text:', responseText);

                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    console.error('Failed to parse delete response:', e);
                    throw new Error('Invalid server response');
                }

                console.log('Delete response data:', data);

                if (!response.ok) {
                    throw new Error(data.message || 'Failed to delete review');
                }

                if (data.status === 'error') {
                    throw new Error(data.message);
                }

                showPopup('Review deleted successfully');
                loadReviews();
            } catch (error) {
                console.error('Error deleting review:', error);
                showPopup(error.message || 'Failed to delete review. Please try again.', true);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Check login status and update navbar
            function updateNavbar() {
                const loginLink = document.getElementById('loginLink');
                const username = localStorage.getItem('username');
                
                if (username) {
                    loginLink.href = 'profile.html';
                    loginLink.innerHTML = '<i class="fas fa-user"></i> Profile';
                    document.getElementById('reviewFormContainer').classList.remove('hidden');
                } else {
                    loginLink.href = 'login.html';
                    loginLink.innerHTML = 'Login';
                    document.getElementById('reviewFormContainer').classList.add('hidden');
                }
            }

            // Initialize navbar on page load
            updateNavbar();

            // Star rating functionality
            const stars = document.querySelectorAll('.star');
            const ratingInput = document.getElementById('rating');
            let selectedRating = 0;

            function updateStars(rating) {
                stars.forEach(star => {
                    const starRating = parseInt(star.dataset.rating);
                    if (starRating <= rating) {
                        star.classList.remove('text-gray-300');
                        star.classList.add('text-yellow-400');
                    } else {
                        star.classList.remove('text-yellow-400');
                        star.classList.add('text-gray-300');
                    }
                });
            }

            stars.forEach(star => {
                star.addEventListener('click', function() {
                    selectedRating = parseInt(this.dataset.rating);
                    ratingInput.value = selectedRating;
                    updateStars(selectedRating);
                });

                star.addEventListener('mouseover', function() {
                    const hoverRating = parseInt(this.dataset.rating);
                    updateStars(hoverRating);
                });

                star.addEventListener('mouseout', function() {
                    updateStars(selectedRating);
                });
            });

            // Submit review
            const reviewForm = document.getElementById('reviewForm');
            reviewForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const username = localStorage.getItem('username');
                if (!username) {
                    window.location.href = '/login.html';
                    return;
                }

                const rating = document.getElementById('rating').value;
                const comment = document.getElementById('comment').value.trim();

                if (!rating || !comment) {
                    showPopup('Please provide both rating and comment', true);
                    return;
                }

                try {
                    const reviewData = {
                        username: username,
                        rating: parseInt(rating),
                        comment: comment
                    };
                    
                    console.log('Submitting review data:', reviewData);
                    
                    const response = await fetch('/api/reviews', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(reviewData)
                    });

                    console.log('Response status:', response.status);
                    const responseText = await response.text();
                    console.log('Raw response:', responseText);
                    
                    let data;
                    try {
                        data = JSON.parse(responseText);
                    } catch (e) {
                        console.error('Failed to parse response:', e);
                        throw new Error('Invalid server response');
                    }
                    
                    console.log('Parsed response data:', data);
                    
                    if (!response.ok) {
                        throw new Error(data.message || 'Failed to submit review');
                    }

                    if (data.status === 'error') {
                        throw new Error(data.message);
                    }

                    showPopup('Review submitted successfully');
                    loadReviews();
                    reviewForm.reset();
                    selectedRating = 0;
                    updateStars(0);
                    ratingInput.value = '';
                } catch (error) {
                    console.error('Error submitting review:', error);
                    showPopup(error.message || 'Failed to submit review. Please try again.', true);
                }
            });

            // Initialize page
            loadReviews();
        });

        function showPopup(message, isError = false) {
            const popup = document.getElementById('popup');
            popup.textContent = message;
            popup.style.display = 'block';
            popup.classList.toggle('error', isError);
            
            setTimeout(() => {
                popup.style.display = 'none';
                popup.classList.remove('error');
            }, 3000);
        }
    </script>
</body>
</html>

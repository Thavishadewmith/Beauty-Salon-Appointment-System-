<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beauty Salon - Services</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      background-image: url('1.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    .service-card {
      transition: transform 0.3s ease;
    }
    .service-card:hover {
      transform: translateY(-5px);
    }
    .content-overlay {
      background-color: rgba(255, 255, 255, 0.9);
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div class="content-overlay">
    <!-- Navbar -->
    <nav class="bg-black p-8 z-20 relative w-full">
      <div class="container mx-auto flex justify-between items-center">
        <!-- Brand -->
        <a href="index.html" class="text-white text-xl font-semibold">Beauty Salon</a>
        <div class="space-x-4">
          <a href="index.html" class="text-white px-4 py-2 hover:bg-gray-700 rounded-lg">Home</a>
          <a href="service.html" class="text-white px-4 py-2 hover:bg-gray-700 rounded-lg">Services</a>
          <a href="reviews.html" class="text-white px-4 py-2 hover:bg-gray-700 rounded-lg">Reviews</a>
          <a href="#" id="bookNowLink" class="text-white px-4 py-2 border-2 border-white hover:bg-white hover:text-black rounded-lg transition duration-300">BOOK NOW</a>
          <a href="login.html" id="loginLink" class="text-white px-4 py-2 border-2 border-white hover:bg-white hover:text-black rounded-lg transition duration-300">Login</a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto p-8">
      <h1 class="text-4xl font-bold text-black mb-8">Our Services</h1>
      
      <!-- Loading Indicator -->
      <div id="loadingIndicator" class="text-center py-8">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600"></div>
        <p class="mt-2 text-gray-600">Loading services...</p>
      </div>

      <!-- Services Grid -->
      <div id="servicesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Services will be loaded here -->
      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-black text-white text-center py-6 mt-10">
      <p>&copy; 2025 Beauty Salon By Aadi. All rights reserved.</p>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Check login status and update navbar
      function updateNavbar() {
        const loginLink = document.getElementById('loginLink');
        const bookNowLink = document.getElementById('bookNowLink');
        const username = localStorage.getItem('username');
        
        if (username) {
          loginLink.href = 'profile.html';
          loginLink.innerHTML = '<i class="fas fa-user"></i> Profile';
          bookNowLink.href = 'book.html';
        } else {
          loginLink.href = 'login.html';
          loginLink.innerHTML = 'Login';
          bookNowLink.href = 'login.html';
        }
      }

      // Load services from backend
      async function loadServices() {
        const loadingIndicator = document.getElementById('loadingIndicator');
        const servicesGrid = document.getElementById('servicesGrid');
        
        try {
          const response = await fetch('/api/admin/services');
          const data = await response.json();
          
          if (data.status === 'success') {
            servicesGrid.innerHTML = data.services.map(service => `
              <div class="service-card bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-2xl font-semibold text-black mb-4">${service.name}</h2>
                <p class="text-gray-600 mb-2">${service.description}</p>
                <div class="flex justify-between items-center mb-4">
                  <p class="text-gray-600">
                    <i class="fas fa-tag mr-2"></i>Rs ${service.price}
                  </p>
                </div>
                <a href="book.html?service=${encodeURIComponent(service.name)}" 
                   class="block text-center text-black border-2 border-black px-4 py-2 rounded-lg hover:bg-black hover:text-white transition duration-300">
                  Book Now
                </a>
              </div>
            `).join('');
          }
        } catch (error) {
          console.error('Error loading services:', error);
          servicesGrid.innerHTML = `
            <div class="col-span-full text-center py-8">
              <p class="text-red-600">Failed to load services. Please try again later.</p>
            </div>
          `;
        } finally {
          loadingIndicator.style.display = 'none';
        }
      }

      // Initialize page
      updateNavbar();
      loadServices();
    });
  </script>
</body>
</html>

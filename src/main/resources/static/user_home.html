<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Home - Beauty Salon</title>
    <link rel = "icon" type = "image.png" href="favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

<!-- Navbar -->
<nav class="bg-blue-500 p-4">
    <div class="container mx-auto flex justify-between items-center">
        <a href="/" class="text-white text-xl font-semibold">Beauty Salon</a>
        <div>
            <a href="/user/appointments" class="text-white px-4 py-2">My Appointments</a>
            <a href="/logout" class="text-white px-4 py-2">Logout</a>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mx-auto p-8 text-center">
    <h1 class="text-4xl font-bold text-blue-600">Welcome, User!</h1>
    <p class="mt-4 text-gray-600">You can book new appointments or view your existing ones.</p>

    <!-- Action Buttons -->
    <div class="mt-6">
        <a href="/user/appointments" class="bg-blue-500 text-white px-6 py-3 inline-block rounded-lg">View Appointments</a>
        <a href="/services" class="bg-green-500 text-white px-6 py-3 inline-block rounded-lg ml-4">Book New Appointment</a>
    </div>
</div>

<!-- Footer -->
<footer class="bg-blue-500 text-white text-center py-4 mt-8">
    <p>&copy; 2025 Beauty Salon. All rights reserved.</p>
</footer>

</body>
</html>

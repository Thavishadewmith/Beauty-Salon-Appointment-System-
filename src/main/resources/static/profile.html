<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Salon - My Profile</title>
    <link rel="icon" type="image.png" href="favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background-color: rgba(0, 0, 0);
            backdrop-filter: blur(10px);
        }
        .main-content {
            padding-top: 100px;
        }
        .appointment-card {
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.95);
        }
        .appointment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        .popup {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 1rem 2rem;
            background-color: #4CAF50;
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .error {
            background-color: #f44336;
        }
        .blurred-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url('salon-bg.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(1px);
            opacity: 0.9;
        }
        .content-overlay {
            position: relative;
            z-index: 1;
            background-color: rgba(255, 255, 255, 0.9);
            min-height: 100vh;
        }
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .status-pending {
            background-color: #FEF3C7;
            color: #92400E;
        }
        .status-confirmed {
            background-color: #DBEAFE;
            color: #1E40AF;
        }
        .status-completed {
            background-color: #D1FAE5;
            color: #065F46;
        }
        .status-cancelled {
            background-color: #FEE2E2;
            color: #991B1B;
        }
        .payment-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .payment-paid {
            background-color: #D1FAE5;
            color: #065F46;
        }
        .payment-pending {
            background-color: #FEF3C7;
            color: #92400E;
        }
    </style>
</head>
<body class="bg-gray-100" style="background: url('1.jpg') center center / cover no-repeat fixed;">
    <div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(255,255,255,0.7);z-index:-1;"></div>
    <div class="blurred-background"></div>
    <div class="content-overlay">
        <!-- Navbar -->
        <nav class="navbar p-4">
            <div class="container mx-auto flex justify-between items-center">
                <a href="index.html" class="text-white text-2xl font-bold tracking-tight">Beauty Salon</a>
                <div class="space-x-6">
                    <a href="index.html" class="text-white hover:text-red-200 transition-colors duration-200">Home</a>
                    <a href="service.html" class="text-white hover:text-red-200 transition-colors duration-200">Services</a>
                    <a href="reviews.html" class="text-white hover:text-red-200 transition-colors duration-200">Reviews</a>
                    <a href="book.html" class="text-white px-4 py-2 border border-white hover:bg-white hover:text-black rounded-lg transition duration-300">Book Now</a>
                    <button onclick="logout()" class="text-white px-4 py-2 border border-white hover:bg-white hover:text-black rounded-lg transition duration-300">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content container mx-auto px-4 py-8">
            <!-- Welcome Section -->
            <div class="bg-white bg-opacity-95 rounded-2xl shadow-xl p-8 mb-8">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-4xl font-bold text-gray-800 mb-2">Welcome back, <span id="username" class="text-red-600">User</span>!</h1>
                        <p class="text-gray-600 text-lg">Manage your appointments here.</p>
                    </div>
                    <a href="book.html" class="inline-flex items-center px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition duration-300">
                        <i class="fas fa-calendar-plus mr-2"></i>
                        New Appointment
                    </a>
                </div>
            </div>

            <!-- Appointments Section -->
            <div class="bg-white bg-opacity-95 rounded-2xl shadow-xl p-8">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-3xl font-bold text-gray-800">Your Appointments</h2>
                    <div class="flex space-x-2">
                        <span class="status-badge status-pending">Pending</span>
                        <span class="status-badge status-confirmed">Confirmed</span>
                        <span class="status-badge status-completed">Completed</span>
                    </div>
                </div>
                <div id="appointmentsList" class="space-y-6">
                    <!-- Appointments will be loaded here -->
                </div>
            </div>
        </main>

        <!-- Popup for messages -->
        <div id="popup" class="popup"></div>

        <!-- Delete Confirmation Modal -->
        <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
            <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4 transform transition-all">
                <div class="text-center">
                    <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100 mb-6">
                        <i class="fas fa-exclamation-circle text-3xl text-red-600"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800 mb-4">Delete Appointment</h3>
                    <p class="text-gray-600 mb-8">Are you sure you want to delete this appointment? This action cannot be undone.</p>
                    <div class="flex justify-center space-x-4">
                        <button id="confirmDelete" class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition duration-300">
                            <i class="fas fa-trash-alt mr-2"></i>Delete
                        </button>
                        <button id="cancelDelete" class="px-6 py-3 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition duration-300">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        function checkLogin() {
            const username = localStorage.getItem('username');
            if (!username) {
                window.location.href = '/login.html';
                return;
            }
            document.getElementById('username').textContent = username;
        }

        // Logout function
        function logout() {
            localStorage.removeItem('username');
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        // Quick Sort implementation for appointments
        function quickSort(appointments, left = 0, right = appointments.length - 1) {
            if (left < right) {
                const pivotIndex = partition(appointments, left, right);
                quickSort(appointments, left, pivotIndex - 1);
                quickSort(appointments, pivotIndex + 1, right);
            }
            return appointments;
        }

        function partition(appointments, left, right) {
            const pivot = appointments[right];
            let i = left - 1;

            for (let j = left; j < right; j++) {
                // Compare both date and time
                const currentDate = new Date(appointments[j].date + 'T' + appointments[j].time);
                const pivotDate = new Date(pivot.date + 'T' + pivot.time);
                
                if (currentDate < pivotDate) {
                    i++;
                    [appointments[i], appointments[j]] = [appointments[j], appointments[i]];
                }
            }

            [appointments[i + 1], appointments[right]] = [appointments[right], appointments[i + 1]];
            return i + 1;
        }

        // Delete appointment
        let currentAppointmentId = null;
        const deleteModal = document.getElementById('deleteModal');
        const confirmDeleteBtn = document.getElementById('confirmDelete');
        const cancelDeleteBtn = document.getElementById('cancelDelete');

        function showDeleteModal(id) {
            currentAppointmentId = id;
            deleteModal.classList.remove('hidden');
        }

        function hideDeleteModal() {
            deleteModal.classList.add('hidden');
            currentAppointmentId = null;
        }

        confirmDeleteBtn.addEventListener('click', async function() {
            if (!currentAppointmentId) return;

            const username = localStorage.getItem('username');
            if (!username) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const response = await fetch(`/api/appointments/${currentAppointmentId}?username=${username}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    throw new Error('Failed to delete appointment');
                }
                
                const data = await response.json();
                if (data.status === 'error') {
                    throw new Error(data.message);
                }
                
                hideDeleteModal();
                showPopup('Appointment deleted successfully');
                loadAppointments();
            } catch (error) {
                console.error('Error deleting appointment:', error);
                hideDeleteModal();
                showPopup('Failed to delete appointment. Please try again.', true);
            }
        });

        cancelDeleteBtn.addEventListener('click', hideDeleteModal);

        // Load appointments
        async function loadAppointments() {
            const username = localStorage.getItem('username');
            if (!username) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const response = await fetch(`/api/appointments/user?username=${username}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch appointments');
                }
                const data = await response.json();
                
                if (data.status === 'error') {
                    throw new Error(data.message);
                }
                
                const appointments = data.appointments;
                const appointmentsList = document.getElementById('appointmentsList');
                
                if (!appointments || appointments.length === 0) {
                    appointmentsList.innerHTML = `
                        <div class="text-center py-8">
                            <p class="text-gray-600 text-lg">You have no appointments scheduled.</p>
                            <a href="/book.html" class="mt-4 inline-block bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition duration-300">
                                Book an Appointment
                            </a>
                        </div>
                    `;
                    return;
                }
                
                // Sort appointments by date and time
                console.log('Before sorting:', appointments);
                const sortedAppointments = quickSort([...appointments]);
                console.log('After sorting:', sortedAppointments);
                
                appointmentsList.innerHTML = sortedAppointments.map(appointment => `
                    <div class="appointment-card rounded-xl p-6">
                        <div class="flex justify-between items-start">
                            <div class="space-y-4 flex-grow">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="text-2xl font-bold text-gray-800 mb-1">${appointment.service}</h3>
                                        <p class="text-gray-500 flex items-center">
                                            <i class="far fa-calendar-alt mr-2"></i>
                                            ${new Date(appointment.date).toLocaleDateString('en-US', { 
                                                weekday: 'long', 
                                                year: 'numeric', 
                                                month: 'long', 
                                                day: 'numeric' 
                                            })}
                                            <span class="mx-2">•</span>
                                            <i class="far fa-clock mr-2"></i>
                                            ${appointment.time}
                                        </p>
                                    </div>
                                    <span class="text-2xl font-bold text-red-600">Rs ${appointment.amount}</span>
                                </div>
                                <div class="flex items-center space-x-4">
                                    <span class="status-badge ${getStatusClass(appointment.status)}">${appointment.status}</span>
                                    <span class="payment-badge ${getPaymentClass(appointment.paymentStatus)}">${appointment.paymentStatus}</span>
                                </div>
                            </div>
                            <button onclick="showDeleteModal('${appointment.id}')" 
                                    class="ml-4 p-2 text-gray-400 hover:text-red-600 transition-colors duration-200">
                                <i class="fas fa-trash-alt text-xl"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading appointments:', error);
                const appointmentsList = document.getElementById('appointmentsList');
                appointmentsList.innerHTML = `
                    <div class="text-center py-8">
                        <p class="text-red-600 text-lg">Failed to load appointments. Please try again later.</p>
                        <button onclick="loadAppointments()" class="mt-4 inline-block bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition duration-300">
                            Retry
                        </button>
                    </div>
                `;
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            checkLogin();
            loadAppointments();
        });

        function showPopup(message, isError = false) {
            const popup = document.getElementById('popup');
            popup.textContent = message;
            popup.style.display = 'block';
            popup.classList.toggle('error', isError);
            
            setTimeout(() => {
                popup.style.display = 'none';
                popup.classList.remove('error');
            }, 3000);
        }

        // Add these helper functions
        function getStatusClass(status) {
            switch(status) {
                case 'Pending': return 'status-pending';
                case 'Confirmed': return 'status-confirmed';
                case 'Completed': return 'status-completed';
                case 'Cancelled': return 'status-cancelled';
                default: return 'status-pending';
            }
        }

        function getPaymentClass(status) {
            return status === 'Paid' ? 'payment-paid' : 'payment-pending';
        }
    </script>
</body>
</html>

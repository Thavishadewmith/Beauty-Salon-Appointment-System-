<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Salon - Book Appointment</title>
    <link rel = "icon" type = "image.png" href="favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

<!-- Navbar -->
<nav class="bg-black p-8 z-20 relative w-full">
    <div class="container mx-auto flex justify-between items-center">
        <!-- Brand -->
        <a href="index.html" class="text-white text-xl font-semibold">Beauty Salon</a>
        <div class="space-x-4">
            <a href="index.html" class="text-white px-4 py-2 hover:bg-gray-700 rounded-lg">Home</a>
            <a href="service.html" class="text-white px-4 py-2 hover:bg-gray-700 rounded-lg">Services</a>
            <a href="reviews.html" class="text-white px-4 py-2 hover:bg-gray-700 rounded-lg">Reviews</a>
            <a href="booking.html" class="text-white px-4 py-2 border-2 border-white hover:bg-white hover:text-black rounded-lg transition duration-300">BOOK NOW</a>
            <a href="login.html" class="text-white px-4 py-2 border-2 border-white hover:bg-white hover:text-black rounded-lg transition duration-300">Login</a>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mx-auto p-8">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-4xl font-bold text-black mb-8 text-center">Book Your Appointment</h1>
        
        <div class="bg-white p-8 rounded-lg shadow-lg">
            <form>
                <!-- Personal Information -->
                <div class="mb-8">
                    <h2 class="text-2xl font-semibold text-black mb-4">Personal Information</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="name" class="block text-gray-700 text-sm font-bold mb-2">Full Name</label>
                            <input type="text" id="name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-black">
                        </div>
                        <div>
                            <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                            <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-black">
                        </div>
                        <div>
                            <label for="phone" class="block text-gray-700 text-sm font-bold mb-2">Phone Number</label>
                            <input type="tel" id="phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-black">
                        </div>
                    </div>
                </div>

                <!-- Service Selection -->
                <div class="mb-8">
                    <h2 class="text-2xl font-semibold text-black mb-4">Select Services</h2>
                    <div class="space-y-4">
                        <div class="flex items-center">
                            <input type="checkbox" id="hair" class="h-5 w-5 text-black border-gray-300 rounded focus:ring-black">
                            <label for="hair" class="ml-2 text-gray-700">Hair Styling</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="facial" class="h-5 w-5 text-black border-gray-300 rounded focus:ring-black">
                            <label for="facial" class="ml-2 text-gray-700">Facial Treatments</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="manicure" class="h-5 w-5 text-black border-gray-300 rounded focus:ring-black">
                            <label for="manicure" class="ml-2 text-gray-700">Manicure & Pedicure</label>
                        </div>
                    </div>
                </div>

                <!-- Date and Time -->
                <div class="mb-8">
                    <h2 class="text-2xl font-semibold text-black mb-4">Select Date & Time</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="date" class="block text-gray-700 text-sm font-bold mb-2">Date</label>
                            <input type="date" id="date" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-black">
                        </div>
                        <div>
                            <label for="time" class="block text-gray-700 text-sm font-bold mb-2">Time</label>
                            <select id="time" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-black">
                                <option value="">Select a time</option>
                                <option value="09:00">9:00 AM</option>
                                <option value="10:00">10:00 AM</option>
                                <option value="11:00">11:00 AM</option>
                                <option value="12:00">12:00 PM</option>
                                <option value="13:00">1:00 PM</option>
                                <option value="14:00">2:00 PM</option>
                                <option value="15:00">3:00 PM</option>
                                <option value="16:00">4:00 PM</option>
                                <option value="17:00">5:00 PM</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Special Requests -->
                <div class="mb-8">
                    <h2 class="text-2xl font-semibold text-black mb-4">Special Requests</h2>
                    <textarea id="requests" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-black" placeholder="Any special requests or notes..."></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800 transition duration-300 text-lg font-semibold">
                    Confirm Booking
                </button>
            </form>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-black text-white text-center py-4 mt-8">
    <p>&copy; 2025 Beauty Salon By Aadi. All rights reserved.</p>
</footer>

</body>
</html>

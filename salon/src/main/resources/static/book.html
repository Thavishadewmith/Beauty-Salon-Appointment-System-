<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - Beauty Salon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .form-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .service-option {
            transition: all 0.3s ease;
        }
        .service-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .service-option.selected {
            background-color: #f3f4f6;
            border-color: #4f46e5;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-lg fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="/" class="text-xl font-bold text-indigo-600">Beauty Salon</a>
                    </div>
                </div>
                <div class="flex items-center">
                    <a href="/" class="text-gray-700 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">Home</a>
                    <a href="/book.html" class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm font-medium">Book Now</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-20 pb-12">
        <div class="form-container">
            <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Book Your Appointment</h1>
            
            <form id="appointmentForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Select Service</label>
                    <div class="mt-2 grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <div class="service-option p-4 border rounded-lg cursor-pointer" data-service="Haircut">
                            <h3 class="text-lg font-medium">Haircut</h3>
                            <p class="text-gray-500">Professional haircut and styling</p>
                        </div>
                        <div class="service-option p-4 border rounded-lg cursor-pointer" data-service="Hair Coloring">
                            <h3 class="text-lg font-medium">Hair Coloring</h3>
                            <p class="text-gray-500">Full or partial hair coloring</p>
                        </div>
                        <div class="service-option p-4 border rounded-lg cursor-pointer" data-service="Manicure">
                            <h3 class="text-lg font-medium">Manicure</h3>
                            <p class="text-gray-500">Nail care and polish</p>
                        </div>
                        <div class="service-option p-4 border rounded-lg cursor-pointer" data-service="Pedicure">
                            <h3 class="text-lg font-medium">Pedicure</h3>
                            <p class="text-gray-500">Foot care and polish</p>
                        </div>
                    </div>
                    <input type="hidden" id="service" name="service" required>
                </div>

                <div>
                    <label for="date" class="block text-sm font-medium text-gray-700">Date</label>
                    <input type="date" id="date" name="date" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>

                <div>
                    <label for="time" class="block text-sm font-medium text-gray-700">Time</label>
                    <select id="time" name="time" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="">Select a time</option>
                        <option value="09:00">9:00 AM</option>
                        <option value="10:00">10:00 AM</option>
                        <option value="11:00">11:00 AM</option>
                        <option value="12:00">12:00 PM</option>
                        <option value="13:00">1:00 PM</option>
                        <option value="14:00">2:00 PM</option>
                        <option value="15:00">3:00 PM</option>
                        <option value="16:00">4:00 PM</option>
                        <option value="17:00">5:00 PM</option>
                    </select>
                </div>

                <div>
                    <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Book Appointment
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white shadow-lg mt-12">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-gray-500 text-sm">
                © 2024 Beauty Salon. All rights reserved.
            </p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Service selection
            const serviceOptions = document.querySelectorAll('.service-option');
            const serviceInput = document.getElementById('service');

            serviceOptions.forEach(option => {
                option.addEventListener('click', function() {
                    serviceOptions.forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    serviceInput.value = this.dataset.service;
                });
            });

            // Form submission
            const form = document.getElementById('appointmentForm');
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const username = localStorage.getItem('username');
                if (!username) {
                    window.location.href = '/login.html';
                    return;
                }

                const appointment = {
                    service: document.getElementById('service').value,
                    date: document.getElementById('date').value,
                    time: document.getElementById('time').value,
                    username: username,
                    status: 'Pending'
                };

                try {
                    const response = await fetch('/api/appointments', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(appointment)
                    });

                    const data = await response.json();
                    
                    if (response.ok) {
                        alert('Appointment booked successfully!');
                        window.location.href = '/profile.html';
                    } else {
                        alert(data.message || 'Failed to book appointment');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred while booking the appointment');
                }
            });

            // Set minimum date to today
            const dateInput = document.getElementById('date');
            const today = new Date().toISOString().split('T')[0];
            dateInput.min = today;
        });
    </script>
</body>
</html>
